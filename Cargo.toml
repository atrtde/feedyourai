[package]
name = "feedyourai"
version = "3.2.0"
edition = "2024"
description = "A tool to combine text files for LLM processing with flexible filtering options."
authors = ["Alexandre Trotel"]
homepage = "https://github.com/alexandretrotel/feedyourai"
repository = "https://github.com/alexandretrotel/feedyourai"
documentation = "https://docs.rs/feedyourai"
include = ["src/**/*.rs", "Cargo.toml", "README.md", "LICENSE", "CHANGELOG.md"]
license = "GPL-3.0-or-later"
readme = "README.md"
keywords = ["cli", "ai", "llm", "context", "codebase"]
categories = ["command-line-utilities", "development-tools", "filesystem"]

[[bin]]
name = "fyai"
path = "src/bin/fyai/main.rs"

[[bin]]
name = "feedyourai"
path = "src/bin/feedyourai/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
arboard = "3.6"
color-eyre = "0.6"
ctrlc = "3.4"
dirs = "6.0"
ignore = "0.4"
indicatif = "0.17"
rayon = "1.12"
same-file = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
simdutf8 = "0.1"
toml = "1"
tempfile = "3.27"
thiserror = "2"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
serial_test = "4.0.1"
